<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./src/styles/form.css">
    <title>Document</title>
</head>
<body>

<!-- START CONTACT US INFORMATION -->

<section class="container-section-form">

<div class="container-box-contact-us">

<div class="box-all-contact-us">

    <div class="box-contact-us">

    <h3 class="form-h3-pattern">Get in Touch</h3>

    <p class="form-p-pattern">Have a question or a project in mind? I'd love to hear from you. Let's chat and make something amazing together.</p>

    </div>

    <div class="box-contact-form">

        <div class="box-content-contact-form">
            <img src="./src/assets/images/bxs_phone-call.png" alt="">
            <p class="form-p-pattern">+1205 5872 321</p>
        </div>

        <div class="box-content-contact-form">
            <img src="./src/assets/images/ic_sharp-email.png" alt="">
            <p class="form-p-pattern">contact@sarajonesdesign.com</p>
        </div>

        <div class="box-content-contact-form">
            <img src="./src/assets/images/carbon_location-filled.png" alt="">
            <p class="form-p-pattern">1234 Design Street,Creativeville, Webland,Imaginary State, 98765</p>
        </div>

    </div>

</div>

<div class="box-img-form">
    <img src="./src/assets/images/twitter.icon.png" alt="">
    <img src="./src/assets/images/instagram.icon.png" alt="">
    <img src="./src/assets/images/basquete.icon.png" alt="">
    <img src="./src/assets/images/facebook.icon.png" alt="">
</div>

</div>

<!-- END CONTACT US INFORMATION -->

<!-- START CONTACT US FORM -->

<form action="#" class="form-section">

    <div class="form-section-information">
    <input type="name" name="name" id="name" placeholder="First name">
    <input type="email" name="email" id="email" placeholder="Email">
    <input type="phone" name="phone" id="phone" placeholder="Phone number">
    <input type="message" name="message" id="message" placeholder="Your message" class="message-form">
    </div>

    <button class="btn-form">Send Message</button>

</form>

</section>

<footer class="container-footer">

    <div class="content-information-footer">

    <div class="footer-information">
        <h4>About</h4>
        <h4>Services</h4>
    </div>

    <img src="./src/assets/images/Logo (2).png" alt="">

    <div class="footer-information">
        <h4>Portfolio</h4>
        <h4>Blog</h4>
    </div>

    </div>

    <div class="footer-social-media">
        <p>Follow me on social media:</p>

        <div class="footer-images">
        <img src="./src/assets/images/Instagram.png" alt="">
        <img src="./src/assets/images/Twitter.png" alt="">
        <img src="./src/assets/images/Dribbble.png" alt="">
        <img src="./src/assets/images/Facebook.png" alt="">
        </div>
    </div>

</footer>







    
</body>
</html>
